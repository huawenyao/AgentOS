<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EFIAgent 2.0 智能Agent设计器演示</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .demo-container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 800px;
            text-align: center;
        }
        
        .demo-title {
            font-size: 32px;
            font-weight: 700;
            color: #1890ff;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #1890ff, #722ed1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .demo-subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin: 32px 0;
        }
        
        .feature-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #e9ecef;
            transition: all 0.3s ease;
        }
        
        .feature-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }
        
        .feature-icon {
            font-size: 32px;
            margin-bottom: 16px;
        }
        
        .feature-title {
            font-size: 18px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .feature-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }
        
        .demo-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 32px;
        }
        
        .demo-button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        .demo-button.primary {
            background: linear-gradient(135deg, #1890ff, #40a9ff);
            color: white;
        }
        
        .demo-button.secondary {
            background: white;
            color: #1890ff;
            border: 2px solid #1890ff;
        }
        
        .demo-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(24, 144, 255, 0.3);
        }
        
        .tech-stack {
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid #e9ecef;
        }
        
        .tech-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 16px;
        }
        
        .tech-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        
        .tech-tag {
            background: #f0f2f5;
            color: #666;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #f6ffed;
            color: #52c41a;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 24px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            background: #52c41a;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(82, 196, 26, 0.4);
            }
            70% {
                box-shadow: 0 0 0 10px rgba(82, 196, 26, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(82, 196, 26, 0);
            }
        }
        
        @media (max-width: 768px) {
            .demo-container {
                padding: 24px;
                margin: 16px;
            }
            
            .demo-title {
                font-size: 24px;
            }
            
            .demo-subtitle {
                font-size: 16px;
            }
            
            .features-grid {
                grid-template-columns: 1fr;
            }
            
            .demo-buttons {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="status-indicator">
            <div class="status-dot"></div>
            前端代码实现完成
        </div>
        
        <h1 class="demo-title">🚀 EFIAgent 2.0</h1>
        <p class="demo-subtitle">
            下一代智能Agent设计器，基于能力系统模型的可视化设计工具<br>
            支持认知、推理、决策、学习四大核心能力维度的系统化建模
        </p>
        
        <div class="features-grid">
            <div class="feature-card">
                <div class="feature-icon">🧠</div>
                <div class="feature-title">智能能力配置</div>
                <div class="feature-desc">AI驱动的配置向导，智能推荐最佳能力组合，支持场景化配置和实时预览</div>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">📚</div>
                <div class="feature-title">增强能力库</div>
                <div class="feature-desc">丰富的能力模块库，支持智能搜索、分类筛选和个性化推荐</div>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">⚡</div>
                <div class="feature-title">可视化编排</div>
                <div class="feature-desc">拖拽式能力编排，实时流程可视化，支持复杂逻辑和并行执行</div>
            </div>
            
            <div class="feature-card">
                <div class="feature-icon">🎯</div>
                <div class="feature-title">实时验证</div>
                <div class="feature-desc">配置实时验证，性能监控，智能优化建议和错误诊断</div>
            </div>
        </div>
        
        <div class="demo-buttons">
            <button class="demo-button primary" onclick="startDemo()">
                🎮 启动演示
            </button>
            <button class="demo-button secondary" onclick="viewCode()">
                📝 查看代码
            </button>
            <button class="demo-button secondary" onclick="viewDocs()">
                📖 查看文档
            </button>
        </div>
        
        <div class="tech-stack">
            <div class="tech-title">技术栈</div>
            <div class="tech-tags">
                <span class="tech-tag">React 18</span>
                <span class="tech-tag">TypeScript</span>
                <span class="tech-tag">Ant Design</span>
                <span class="tech-tag">ReactFlow</span>
                <span class="tech-tag">CSS3</span>
                <span class="tech-tag">响应式设计</span>
                <span class="tech-tag">无障碍支持</span>
            </div>
        </div>
    </div>
    
    <script>
        function startDemo() {
            alert('演示功能需要启动React开发服务器。\n\n请在项目目录下运行：\nnpm install\nnpm start\n\n然后访问 http://localhost:3000');
        }
        
        function viewCode() {
            alert('代码已实现完成！\n\n主要组件：\n• IntelligentCapabilityConfig.tsx - 智能能力配置\n• EnhancedCapabilityLibrary.tsx - 增强能力库\n• VisualCapabilityOrchestrator.tsx - 可视化编排器\n• 对应的CSS样式文件\n\n已集成到 AgentDesigner2_0.tsx 主组件中');
        }
        
        function viewDocs() {
            alert('文档说明：\n\n1. 智能能力配置：提供AI驱动的配置向导\n2. 增强能力库：丰富的能力模块管理\n3. 可视化编排：拖拽式流程设计\n4. 响应式设计：支持多种设备\n5. 无障碍支持：符合WCAG标准\n\n所有组件都已实现并集成到主设计器中');
        }
        
        // 添加一些交互效果
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.feature-card');
            cards.forEach((card, index) => {
                card.style.animationDelay = `${index * 0.1}s`;
                card.style.animation = 'fadeInUp 0.6s ease forwards';
            });
        });
        
        // 添加CSS动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(30px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
