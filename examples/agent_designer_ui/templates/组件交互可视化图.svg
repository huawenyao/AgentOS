<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1200" height="800" fill="#0f0f23"/>
  
  <!-- 标题 -->
  <text x="600" y="30" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="bold">
    高考志愿填报系统 - 组件交互架构图
  </text>
  
  <!-- 主容器组件 -->
  <rect x="50" y="60" width="1100" height="680" fill="none" stroke="#00f5ff" stroke-width="2" stroke-dasharray="5,5" rx="10"/>
  <text x="70" y="85" fill="#00f5ff" font-size="16" font-weight="bold">CollegeAdmissionAnalyzer (主容器)</text>
  
  <!-- 输入层组件 -->
  <g id="input-layer">
    <rect x="100" y="120" width="200" height="120" fill="url(#grad1)" rx="8" filter="url(#shadow)"/>
    <text x="200" y="145" text-anchor="middle" fill="white" font-size="14" font-weight="bold">StudentForm</text>
    <text x="200" y="165" text-anchor="middle" fill="white" font-size="12">学生信息输入</text>
    <text x="110" y="185" fill="white" font-size="10">• 姓名输入</text>
    <text x="110" y="200" fill="white" font-size="10">• 成绩输入</text>
    <text x="110" y="215" fill="white" font-size="10">• 偏好设置</text>
    <text x="110" y="230" fill="white" font-size="10">• 数据验证</text>
  </g>
  
  <!-- 处理层组件 -->
  <g id="processing-layer">
    <rect x="350" y="120" width="200" height="120" fill="url(#grad2)" rx="8" filter="url(#shadow)"/>
    <text x="450" y="145" text-anchor="middle" fill="white" font-size="14" font-weight="bold">AnalysisProgress</text>
    <text x="450" y="165" text-anchor="middle" fill="white" font-size="12">分析进度控制</text>
    <text x="360" y="185" fill="white" font-size="10">• 6步骤流程</text>
    <text x="360" y="200" fill="white" font-size="10">• 进度动画</text>
    <text x="360" y="215" fill="white" font-size="10">• 状态管理</text>
    <text x="360" y="230" fill="white" font-size="10">• 日志记录</text>
  </g>
  
  <!-- 输出层组件 -->
  <g id="output-layer">
    <rect x="600" y="120" width="200" height="120" fill="url(#grad3)" rx="8" filter="url(#shadow)"/>
    <text x="700" y="145" text-anchor="middle" fill="white" font-size="14" font-weight="bold">ResultDisplay</text>
    <text x="700" y="165" text-anchor="middle" fill="white" font-size="12">结果展示</text>
    <text x="610" y="185" fill="white" font-size="10">• 推荐列表</text>
    <text x="610" y="200" fill="white" font-size="10">• 概率分析</text>
    <text x="610" y="215" fill="white" font-size="10">• 风险评估</text>
    <text x="610" y="230" fill="white" font-size="10">• 详情弹窗</text>
  </g>
  
  <!-- 可视化组件 -->
  <g id="chart-layer">
    <rect x="850" y="120" width="200" height="120" fill="url(#grad1)" rx="8" filter="url(#shadow)"/>
    <text x="950" y="145" text-anchor="middle" fill="white" font-size="14" font-weight="bold">AnalysisChart</text>
    <text x="950" y="165" text-anchor="middle" fill="white" font-size="12">数据可视化</text>
    <text x="860" y="185" fill="white" font-size="10">• 成绩分布图</text>
    <text x="860" y="200" fill="white" font-size="10">• 概率柱状图</text>
    <text x="860" y="215" fill="white" font-size="10">• 趋势分析</text>
    <text x="860" y="230" fill="white" font-size="10">• 交互事件</text>
  </g>
  
  <!-- 数据层 -->
  <g id="data-layer">
    <rect x="200" y="300" width="800" height="100" fill="rgba(255,255,255,0.1)" stroke="#ffd700" stroke-width="2" rx="8"/>
    <text x="600" y="325" text-anchor="middle" fill="#ffd700" font-size="16" font-weight="bold">数据管理层</text>
    
    <rect x="220" y="340" width="150" height="50" fill="rgba(255,215,0,0.2)" stroke="#ffd700" rx="5"/>
    <text x="295" y="360" text-anchor="middle" fill="#ffd700" font-size="12">StateManager</text>
    <text x="295" y="375" text-anchor="middle" fill="#ffd700" font-size="10">状态管理</text>
    
    <rect x="390" y="340" width="150" height="50" fill="rgba(255,215,0,0.2)" stroke="#ffd700" rx="5"/>
    <text x="465" y="360" text-anchor="middle" fill="#ffd700" font-size="12">MockData</text>
    <text x="465" y="375" text-anchor="middle" fill="#ffd700" font-size="10">模拟数据</text>
    
    <rect x="560" y="340" width="150" height="50" fill="rgba(255,215,0,0.2)" stroke="#ffd700" rx="5"/>
    <text x="635" y="360" text-anchor="middle" fill="#ffd700" font-size="12">AnalysisEngine</text>
    <text x="635" y="375" text-anchor="middle" fill="#ffd700" font-size="10">分析引擎</text>
    
    <rect x="730" y="340" width="150" height="50" fill="rgba(255,215,0,0.2)" stroke="#ffd700" rx="5"/>
    <text x="805" y="360" text-anchor="middle" fill="#ffd700" font-size="12">CacheManager</text>
    <text x="805" y="375" text-anchor="middle" fill="#ffd700" font-size="10">缓存管理</text>
  </g>
  
  <!-- 数据流箭头 -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff88" />
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff4757" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#3742fa" />
    </marker>
  </defs>
  
  <!-- 主要数据流 -->
  <line x1="300" y1="180" x2="350" y2="180" stroke="#00ff88" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="325" y="175" text-anchor="middle" fill="#00ff88" font-size="10">输入数据</text>
  
  <line x1="550" y1="180" x2="600" y2="180" stroke="#00ff88" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="575" y="175" text-anchor="middle" fill="#00ff88" font-size="10">分析结果</text>
  
  <line x1="800" y1="180" x2="850" y2="180" stroke="#00ff88" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="825" y="175" text-anchor="middle" fill="#00ff88" font-size="10">图表数据</text>
  
  <!-- 状态管理连接 -->
  <line x1="295" y1="340" x2="200" y2="260" stroke="#ff4757" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <line x1="295" y1="340" x2="450" y2="260" stroke="#ff4757" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <line x1="295" y1="340" x2="700" y2="260" stroke="#ff4757" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  <line x1="295" y1="340" x2="950" y2="260" stroke="#ff4757" stroke-width="2" marker-end="url(#arrowhead-red)"/>
  
  <!-- 数据源连接 -->
  <line x1="465" y1="340" x2="450" y2="260" stroke="#3742fa" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  <line x1="635" y1="340" x2="450" y2="260" stroke="#3742fa" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
  
  <!-- 时序步骤 -->
  <g id="sequence-steps">
    <rect x="100" y="450" width="1000" height="250" fill="rgba(0,0,0,0.3)" stroke="#ffffff" stroke-width="1" rx="8"/>
    <text x="600" y="475" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="bold">执行时序流程</text>
    
    <!-- 步骤1 -->
    <circle cx="150" cy="520" r="20" fill="#667eea" stroke="#ffffff" stroke-width="2"/>
    <text x="150" y="525" text-anchor="middle" fill="white" font-size="12" font-weight="bold">1</text>
    <text x="150" y="550" text-anchor="middle" fill="#ffffff" font-size="10">用户输入</text>
    
    <!-- 步骤2 -->
    <circle cx="280" cy="520" r="20" fill="#f093fb" stroke="#ffffff" stroke-width="2"/>
    <text x="280" y="525" text-anchor="middle" fill="white" font-size="12" font-weight="bold">2</text>
    <text x="280" y="550" text-anchor="middle" fill="#ffffff" font-size="10">数据验证</text>
    
    <!-- 步骤3 -->
    <circle cx="410" cy="520" r="20" fill="#4facfe" stroke="#ffffff" stroke-width="2"/>
    <text x="410" y="525" text-anchor="middle" fill="white" font-size="12" font-weight="bold">3</text>
    <text x="410" y="550" text-anchor="middle" fill="#ffffff" font-size="10">启动分析</text>
    
    <!-- 步骤4 -->
    <circle cx="540" cy="520" r="20" fill="#a8edea" stroke="#ffffff" stroke-width="2"/>
    <text x="540" y="525" text-anchor="middle" fill="white" font-size="12" font-weight="bold">4</text>
    <text x="540" y="550" text-anchor="middle" fill="#ffffff" font-size="10">进度更新</text>
    
    <!-- 步骤5 -->
    <circle cx="670" cy="520" r="20" fill="#ffecd2" stroke="#ffffff" stroke-width="2"/>
    <text x="670" y="525" text-anchor="middle" fill="black" font-size="12" font-weight="bold">5</text>
    <text x="670" y="550" text-anchor="middle" fill="#ffffff" font-size="10">生成结果</text>
    
    <!-- 步骤6 -->
    <circle cx="800" cy="520" r="20" fill="#d299c2" stroke="#ffffff" stroke-width="2"/>
    <text x="800" y="525" text-anchor="middle" fill="white" font-size="12" font-weight="bold">6</text>
    <text x="800" y="550" text-anchor="middle" fill="#ffffff" font-size="10">结果展示</text>
    
    <!-- 步骤7 -->
    <circle cx="930" cy="520" r="20" fill="#fad0c4" stroke="#ffffff" stroke-width="2"/>
    <text x="930" y="525" text-anchor="middle" fill="black" font-size="12" font-weight="bold">7</text>
    <text x="930" y="550" text-anchor="middle" fill="#ffffff" font-size="10">图表渲染</text>
    
    <!-- 连接线 -->
    <line x1="170" y1="520" x2="260" y2="520" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="300" y1="520" x2="390" y2="520" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="430" y1="520" x2="520" y2="520" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="560" y1="520" x2="650" y2="520" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="690" y1="520" x2="780" y2="520" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowhead)"/>
    <line x1="820" y1="520" x2="910" y2="520" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- 详细步骤说明 -->
    <text x="150" y="580" text-anchor="middle" fill="#cccccc" font-size="9">StudentForm</text>
    <text x="150" y="595" text-anchor="middle" fill="#cccccc" font-size="9">收集信息</text>
    
    <text x="280" y="580" text-anchor="middle" fill="#cccccc" font-size="9">DataValidator</text>
    <text x="280" y="595" text-anchor="middle" fill="#cccccc" font-size="9">验证输入</text>
    
    <text x="410" y="580" text-anchor="middle" fill="#cccccc" font-size="9">AnalysisEngine</text>
    <text x="410" y="595" text-anchor="middle" fill="#cccccc" font-size="9">开始处理</text>
    
    <text x="540" y="580" text-anchor="middle" fill="#cccccc" font-size="9">ProgressTracker</text>
    <text x="540" y="595" text-anchor="middle" fill="#cccccc" font-size="9">实时反馈</text>
    
    <text x="670" y="580" text-anchor="middle" fill="#cccccc" font-size="9">ResultGenerator</text>
    <text x="670" y="595" text-anchor="middle" fill="#cccccc" font-size="9">计算完成</text>
    
    <text x="800" y="580" text-anchor="middle" fill="#cccccc" font-size="9">ResultDisplay</text>
    <text x="800" y="595" text-anchor="middle" fill="#cccccc" font-size="9">展示结果</text>
    
    <text x="930" y="580" text-anchor="middle" fill="#cccccc" font-size="9">AnalysisChart</text>
    <text x="930" y="595" text-anchor="middle" fill="#cccccc" font-size="9">可视化</text>
  </g>
  
  <!-- 图例 -->
  <g id="legend">
    <rect x="50" y="720" width="300" height="60" fill="rgba(0,0,0,0.5)" stroke="#ffffff" stroke-width="1" rx="5"/>
    <text x="200" y="740" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="bold">图例说明</text>
    
    <line x1="70" y1="750" x2="90" y2="750" stroke="#00ff88" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="95" y="755" fill="#00ff88" font-size="10">数据流向</text>
    
    <line x1="170" y1="750" x2="190" y2="750" stroke="#ff4757" stroke-width="2" marker-end="url(#arrowhead-red)"/>
    <text x="195" y="755" fill="#ff4757" font-size="10">状态管理</text>
    
    <line x1="270" y1="750" x2="290" y2="750" stroke="#3742fa" stroke-width="2" marker-end="url(#arrowhead-blue)"/>
    <text x="295" y="755" fill="#3742fa" font-size="10">数据源</text>
    
    <text x="70" y="770" fill="#cccccc" font-size="9">组件间通过props和回调函数进行通信</text>
  </g>
</svg>