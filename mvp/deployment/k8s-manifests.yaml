# EFIAgent Phase 2 Kubernetes 部署清单
# 完整的Kubernetes资源配置文件

---
# 1. 命名空间
apiVersion: v1
kind: Namespace
metadata:
  name: efiagent
  labels:
    name: efiagent
    istio-injection: enabled

---
# 2. 服务账户
apiVersion: v1
kind: ServiceAccount
metadata:
  name: efiagent-service-account
  namespace: efiagent

---
# 3. ConfigMap - 应用配置
apiVersion: v1
kind: ConfigMap
metadata:
  name: efiagent-config
  namespace: efiagent
data:
  config.yaml: |
    # EFIAgent Phase 2 配置
    app:
      name: "EFIAgent"
      version: "v2.0.0"
      environment: "production"
      log_level: "INFO"

    # 技能向量匹配配置
    skill_vector:
      dimension: 128
      embedding_model: "text-embedding-ada-002"
      similarity_threshold: 0.7
      cache_size: 10000
      index_type: "hnsw"

    # 零信任安全配置
    zero_trust:
      jwt_expiry: 3600
      session_timeout: 1800
      max_login_attempts: 5
      encryption_algorithm: "AES-256-GCM"
      audit_retention_days: 90

    # 通信框架配置
    communication:
      heartbeat_interval: 30
      message_ttl: 300
      max_message_size: 1048576  # 1MB
      topology_adaptation_interval: 300
      max_retries: 3

    # 性能配置
    performance:
      max_concurrent_tasks: 100
      worker_threads: 8
      queue_size: 10000
      cache_ttl: 3600

---
# 4. Secret - 敏感配置
apiVersion: v1
kind: Secret
metadata:
  name: efiagent-secrets
  namespace: efiagent
type: Opaque
data:
  # Base64编码的密钥
  database-url: <BASE64_ENCODED_DATABASE_URL>
  jwt-secret: <BASE64_ENCODED_JWT_SECRET>
  redis-password: <BASE64_ENCODED_REDIS_PASSWORD>
  openai-api-key: <BASE64_ENCODED_OPENAI_API_KEY>
  blockchain-private-key: <BASE64_ENCODED_BLOCKCHAIN_PRIVATE_KEY>

---
# 5. 技能向量匹配器部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-vector-matcher
  namespace: efiagent
  labels:
    app: skill-vector-matcher
    version: v2.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: skill-vector-matcher
  template:
    metadata:
      labels:
        app: skill-vector-matcher
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: efiagent-service-account
      containers:
      - name: skill-vector-matcher
        image: registry.efiagent.com/skill-vector-matcher:v2.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9090
          name: metrics
        env:
        - name: CONFIG_PATH
          value: "/app/config/config.yaml"
        - name: REDIS_URL
          value: "redis://redis-cluster:6379"
        - name: WEAVIATE_URL
          value: "http://weaviate:8080"
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: efiagent-secrets
              key: openai-api-key
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: efiagent-config
      nodeSelector:
        node-type: worker
      tolerations:
      - key: "workload"
        operator: "Equal"
        value: "efiagent"
        effect: "NoSchedule"

---
# 6. 技能向量匹配器服务
apiVersion: v1
kind: Service
metadata:
  name: skill-vector-matcher
  namespace: efiagent
  labels:
    app: skill-vector-matcher
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  type: ClusterIP
  selector:
    app: skill-vector-matcher
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP

---
# 7. 零信任安全管理器部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero-trust-manager
  namespace: efiagent
  labels:
    app: zero-trust-manager
    version: v2.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zero-trust-manager
  template:
    metadata:
      labels:
        app: zero-trust-manager
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: efiagent-service-account
      containers:
      - name: zero-trust-manager
        image: registry.efiagent.com/zero-trust-manager:v2.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 9090
          name: http
        - containerPort: 9091
          name: metrics
        env:
        - name: CONFIG_PATH
          value: "/app/config/config.yaml"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: efiagent-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: efiagent-secrets
              key: jwt-secret
        - name: BLOCKCHAIN_ENDPOINT
          value: "https://blockchain.efiagent.com"
        - name: BLOCKCHAIN_PRIVATE_KEY
          valueFrom:
            secretKeyRef:
              name: efiagent-secrets
              key: blockchain-private-key
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: certs
          mountPath: /app/certs
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      volumes:
      - name: config
        configMap:
          name: efiagent-config
      - name: certs
        secret:
          secretName: efiagent-certs

---
# 8. 零信任安全管理器服务
apiVersion: v1
kind: Service
metadata:
  name: zero-trust-manager
  namespace: efiagent
  labels:
    app: zero-trust-manager
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9091"
spec:
  type: ClusterIP
  selector:
    app: zero-trust-manager
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP
  - name: metrics
    port: 9091
    targetPort: 9091
    protocol: TCP

---
# 9. 协作通信框架部署 (StatefulSet)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: collaborative-framework
  namespace: efiagent
  labels:
    app: collaborative-framework
    version: v2.0.0
spec:
  serviceName: collaborative-framework
  replicas: 5
  selector:
    matchLabels:
      app: collaborative-framework
  template:
    metadata:
      labels:
        app: collaborative-framework
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: efiagent-service-account
      containers:
      - name: collaborative-framework
        image: registry.efiagent.com/collaborative-framework:v2.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8001
          name: metrics
        env:
        - name: AGENT_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CLUSTER_SIZE
          value: "5"
        - name: CONFIG_PATH
          value: "/app/config/config.yaml"
        - name: REDIS_CLUSTER_URL
          value: "redis://redis-cluster:6379"
        - name: TOPOLOGY_ADAPTATION_INTERVAL
          value: "300"
        - name: ZERO_TRUST_URL
          value: "http://zero-trust-manager:9090"
        - name: SKILL_MATCHER_URL
          value: "http://skill-vector-matcher:8080"
        resources:
          requests:
            memory: "1.5Gi"
            cpu: "800m"
          limits:
            memory: "3Gi"
            cpu: "1600m"
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: data
          mountPath: /app/data
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
      volumes:
      - name: config
        configMap:
          name: efiagent-config
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi

---
# 10. 协作通信框架服务
apiVersion: v1
kind: Service
metadata:
  name: collaborative-framework
  namespace: efiagent
  labels:
    app: collaborative-framework
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8001"
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: collaborative-framework
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 8001
    targetPort: 8001
    protocol: TCP

---
# 11. API网关部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: efiagent
  labels:
    app: api-gateway
    version: v2.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: efiagent-service-account
      containers:
      - name: api-gateway
        image: registry.efiagent.com/api-gateway:v2.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8443
          name: https
        env:
        - name: CONFIG_PATH
          value: "/app/config/config.yaml"
        - name: SKILL_VECTOR_MATCHER_URL
          value: "http://skill-vector-matcher:8080"
        - name: ZERO_TRUST_MANAGER_URL
          value: "http://zero-trust-manager:9090"
        - name: COLLABORATIVE_FRAMEWORK_URL
          value: "http://collaborative-framework:8000"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: efiagent-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: efiagent-config

---
# 12. API网关服务
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: efiagent
  labels:
    app: api-gateway
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    protocol: TCP
  - name: https
    port: 8443
    targetPort: 8443
    protocol: TCP

---
# 13. 前端部署
apiVersion: apps/v1
kind: Deployment
metadata:
  name: efiagent-frontend
  namespace: efiagent
  labels:
    app: efiagent-frontend
    version: v2.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: efiagent-frontend
  template:
    metadata:
      labels:
        app: efiagent-frontend
        version: v2.0.0
    spec:
      containers:
      - name: efiagent-frontend
        image: registry.efiagent.com/efiagent-frontend:v2.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
        env:
        - name: REACT_APP_API_URL
          value: "https://api.efiagent.com"
        - name: REACT_APP_WS_URL
          value: "wss://api.efiagent.com"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5

---
# 14. 前端服务
apiVersion: v1
kind: Service
metadata:
  name: efiagent-frontend
  namespace: efiagent
  labels:
    app: efiagent-frontend
spec:
  type: ClusterIP
  selector:
    app: efiagent-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP

---
# 15. Ingress - 流量入口
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: efiagent-ingress
  namespace: efiagent
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - efiagent.com
    - api.efiagent.com
    secretName: efiagent-tls
  rules:
  - host: efiagent.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: efiagent-frontend
            port:
              number: 80
  - host: api.efiagent.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080

---
# 16. HPA - 水平自动扩缩容
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: skill-vector-matcher-hpa
  namespace: efiagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: skill-vector-matcher
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# 17. Zero Trust Manager HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: zero-trust-manager-hpa
  namespace: efiagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: zero-trust-manager
  minReplicas: 2
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70

---
# 18. Collaborative Framework HPA
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: collaborative-framework-hpa
  namespace: efiagent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: collaborative-framework
  minReplicas: 5
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 65
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75

---
# 19. NetworkPolicy - 网络策略
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: efiagent-network-policy
  namespace: efiagent
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: istio-system
    - namespaceSelector:
        matchLabels:
          name: efiagent
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: efiagent
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to: []
    ports:
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 80

---
# 20. PodSecurityPolicy - Pod安全策略
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: efiagent-psp
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  fsGroup:
    rule: 'RunAsAny'
  readOnlyRootFilesystem: true

---
# 21. ServiceMonitor - Prometheus监控
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: efiagent-metrics
  namespace: efiagent
  labels:
    app: efiagent
spec:
  selector:
    matchLabels:
      app: skill-vector-matcher
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: zero-trust-metrics
  namespace: efiagent
  labels:
    app: efiagent
spec:
  selector:
    matchLabels:
      app: zero-trust-manager
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: collaborative-framework-metrics
  namespace: efiagent
  labels:
    app: efiagent
spec:
  selector:
    matchLabels:
      app: collaborative-framework
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics

---
# 22. PodDisruptionBudget - 中断预算
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  name: skill-vector-matcher-pdb
  namespace: efiagent
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: skill-vector-matcher
---
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  name: zero-trust-manager-pdb
  namespace: efiagent
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: zero-trust-manager
---
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  name: collaborative-framework-pdb
  namespace: efiagent
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app: collaborative-framework

---
# 23. ResourceQuota - 资源配额
apiVersion: v1
kind: ResourceQuota
metadata:
  name: efiagent-quota
  namespace: efiagent
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    persistentvolumeclaims: "20"
    services: "20"
    secrets: "20"
    configmaps: "20"

---
# 24. LimitRange - 限制范围
apiVersion: v1
kind: LimitRange
metadata:
  name: efiagent-limits
  namespace: efiagent
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "1Gi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - max:
      cpu: "4"
      memory: "8Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
    type: Container